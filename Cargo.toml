[workspace]
resolver = "3"
members = [
  "crates/sourcetrait_grammar_dev",
  "crates/sourcetrait_grammar_lib",
  "crates/sourcetrait_nu_vocab",
  "crates/sourcetrait_grimoire",
  "crates/sourcetrait_nu_model",
  "crates/sourcetrait_grammar_mcp",
  "crates/sourcetrait_grammar_tests",
  "crates/misc/sourcetrait_grammar_bed",
  "crates/misc/sourcetrait_grammar_know_rust",
  "crates/misc/sourcetrait_grammar_claudeline",
  "crates/misc/sourcetrait_grammar_puremd_mdbook",
  "crates/misc/sourcetrait_grammar_arxivmd",
]

[workspace.package]
version = "0.0.0-2"
edition = "2024"
authors = ["SourceTrait <development@sourcetrait.com"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/sourcetrait/sourcetrait_grammar"
homepage = "https://sourcetrait.com"
categories = []
keywords = ["sourcetrait", "grammar"]

[workspace.dependencies]
bitcode = { version = "0.6" }
chrono = { version = "0.4" }
chrono-tz = { version = "0.10" }
clap = { version = "4", features = ["derive"] }
derive_builder = { version = "0.20" }
directories = { version = "6" }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
hek = { version = "0.5" }
include_dir = { version = "0.7", features = ["glob"] }
indexmap = { version = "2" }
indoc = { version = "2" }
liquid = { version = "0.26" }
heck = { version = "0.5" }
mdbook-preprocessor = { version = "0.5" }
nix = { version = "0.31", features = ["fs", "process", "signal", "user"] }
nu-cmd-extra = { git = "https://github.com/nushell/nushell", tag = "0.114.1" }
nu-cmd-lang = { git = "https://github.com/nushell/nushell", tag = "0.114.1" }
nu-cmd-plugin = { git = "https://github.com/nushell/nushell", tag = "0.114.1" }
nu-command = { git = "https://github.com/nushell/nushell", tag = "0.114.1" }
nu-engine = { git = "https://github.com/nushell/nushell", tag = "0.114.1" }
nu-glob = { git = "https://github.com/nushell/nushell", tag = "0.114.1" }
nu-json = { git = "https://github.com/nushell/nushell", tag = "0.114.1" }
nu-parser = { git = "https://github.com/nushell/nushell", tag = "0.114.1" }
nu-path = { git = "https://github.com/nushell/nushell", tag = "0.114.1" }
nu-plugin = { git = "https://github.com/nushell/nushell", tag = "0.114.1" }
nu-plugin-engine = { git = "https://github.com/nushell/nushell", tag = "0.114.1" }
nu-protocol = { git = "https://github.com/nushell/nushell", tag = "0.114.1" }
nuon = { git = "https://github.com/nushell/nushell", tag = "0.114.1" }
proc-macro2 = { version = "1", features = ["span-locations"] }
pretty_assertions = { version = "1" }
pulldown-cmark = { version = "0.13" }
regex = { version = "1" }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "gzip"] }
rmcp = { version = "1.7", features = ["server", "transport-io", "schemars", "macros"] }
rmp-serde = { version = "1.3" }
rustls = { version = "0.23", default-features = false, features = ["logging", "ring", "std", "tls12"] }
schemars = { version = "1" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
serde_norway = { version = "0.9" }
semver = { version = "1" }
shellexpand = { version = "3", features = ["path"] }
snafu = "0.8"
strum = { version = "0.27", features = ["derive"] }
spdx = { version = "0.13" }
syn = { version = "2", features = ["full", "extra-traits", "visit"] }
tempfile = { version = "3.20" }
time = { version = "0.3" }
tokio = { version = "1", features = ["macros", "process", "io-util", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["logging", "ring", "tls12"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
tokio-util = { version = "0.7", features = ["codec"] }
toml = { version = "0.8" }
walkdir = { version = "2" }
xxhash-rust = { version = "0.8", features = ["xxh3"] }
zstd = { version = "0.13" }

sourcetrait_chronox     = { version = ">=0.0.0-0" }
sourcetrait_clapx       = { version = ">=0.0.0-0" }
sourcetrait_ronx        = { version = ">=0.0.0-0" }
sourcetrait_stdx        = { version = ">=0.0.0-0" }
sourcetrait_sysgreen    = { version = ">=0.0.0-0" }
sourcetrait_testing     = { version = ">=0.0.0-0" }
sourcetrait_tomlx       = { version = ">=0.0.0-0" }

sourcetrait_cert_lib    = { path = "../sourcetrait_cert/crates/sourcetrait_cert_lib" }

sourcetrait_grammar_bed = { path = "crates/sourcetrait_grammar_bed" }
sourcetrait_grammar_lib = { path = "crates/sourcetrait_grammar_lib" }
sourcetrait_nu_vocab    = { path = "crates/sourcetrait_nu_vocab" }

[patch."https://github.com/nushell/nushell"]
nu-cmd-extra = { git = "https://github.com/sourcetrait/nufork", branch = "fork/sourcetrait" }
nu-cmd-lang = { git = "https://github.com/sourcetrait/nufork", branch = "fork/sourcetrait" }
nu-cmd-plugin = { git = "https://github.com/sourcetrait/nufork", branch = "fork/sourcetrait" }
nu-command = { git = "https://github.com/sourcetrait/nufork", branch = "fork/sourcetrait" }
nu-engine = { git = "https://github.com/sourcetrait/nufork", branch = "fork/sourcetrait" }
nu-glob = { git = "https://github.com/sourcetrait/nufork", branch = "fork/sourcetrait" }
nu-json = { git = "https://github.com/sourcetrait/nufork", branch = "fork/sourcetrait" }
nu-parser = { git = "https://github.com/sourcetrait/nufork", branch = "fork/sourcetrait" }
nu-path = { git = "https://github.com/sourcetrait/nufork", branch = "fork/sourcetrait" }
nu-plugin = { git = "https://github.com/sourcetrait/nufork", branch = "fork/sourcetrait" }
nu-plugin-engine = { git = "https://github.com/sourcetrait/nufork", branch = "fork/sourcetrait" }
nu-protocol = { git = "https://github.com/sourcetrait/nufork", branch = "fork/sourcetrait" }
nuon = { git = "https://github.com/sourcetrait/nufork", branch = "fork/sourcetrait" }

[profile.release]
# EmbedEngine principle 1 (grammar): eval runs in-process on host threads and a
# panicking body is caught by catch_unwind so it fails one eval, not the host. That
# REQUIRES unwinding - `panic = "abort"` would make the catch moot and a single bad
# body would take the whole MCP down. Pinned explicit as an invariant (it is also
# the default; the lock is to make any future change to abort a deliberate edit).
panic = "unwind"

[package]
name = "sourcetrait_ai_nu_plugin_empowered"
version = "0.0.0-5"
edition = "2024"
description = "Nushell plugin supporting SourceTrait Empower"
authors = ["SourceTrait <development@sourcetrait.com>"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/sourcetrait/sourcetrait_ai_empower"
homepage = "https://sourcetrait.com"
categories = []
keywords = ["sourcetrait", "empower", "nu-plugin"]

[[bin]]
name = "nu_plugin_empowered"
path = "src/main.rs"

[dependencies]
liquid.workspace = true
nu-glob.workspace = true
nu-parser.workspace = true
nu-path.workspace = true
nu-plugin.workspace = true
nu-protocol.workspace = true
regex.workspace = true
snafu.workspace = true

[dev-dependencies]
tempfile.workspace = true

# nu-plugin-test-support stays out -- 0.113 pulls nu-plugin-engine 0.113.1 with a
# non-exhaustive-match upstream bug (ServerCommunicationIo::LocalSocket arm
# missing in init.rs); re-add when an upstream release ships the fix. The tree /
# md cores are unit-tested directly; plugin-level end-to-end is verified live.

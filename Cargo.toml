[workspace]
resolver = "2"
members = [
  "crates/sourcetrait_lib_empower",
  "crates/sourcetrait_cmdlib_empower",
  "crates/nu_plugin_empower",
  "crates/nu_sh_mcp",
]

[workspace.dependencies]
chrono = { version = "0.4" }
clap = { version = "4", features = ["derive"] }
derive_builder = { version = "0.20" }
directories = { version = "6" }
hek = { version = "0.5" }
nix = { version = "0.30", features = ["process"] }
nu-cmd-lang = { git = "https://github.com/nushell/nushell", tag = "0.113.1" }
nu-command = { git = "https://github.com/nushell/nushell", tag = "0.113.1" }
nu-engine = { git = "https://github.com/nushell/nushell", tag = "0.113.1" }
nu-json = { git = "https://github.com/nushell/nushell", tag = "0.113.1" }
nu-parser = { git = "https://github.com/nushell/nushell", tag = "0.113.1" }
nu-plugin = { git = "https://github.com/nushell/nushell", tag = "0.113.1" }
nu-protocol = { git = "https://github.com/nushell/nushell", tag = "0.113.1" }
nuon = { git = "https://github.com/nushell/nushell", tag = "0.113.1" }
regex = { version = "1" }
rmcp = { version = "1.7", features = ["server", "transport-io", "schemars", "macros"] }
rmp-serde = { version = "1.3" }
schemars = { version = "1" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
shellexpand = { version = "3", features = ["path"] }
snafu = "0.8"
sourcetrait_chronox = { version = "1" }
sourcetrait_clapx = { version = "1" }
sourcetrait_cmdlib_empower = { path = "crates/sourcetrait_cmdlib_empower" }
sourcetrait_lib_empower = { path = "crates/sourcetrait_lib_empower" }
sourcetrait_ronx = { version = "3" }
sourcetrait_stdx = { version = "1" }
sourcetrait_testing = { version = "4" }
sourcetrait_tomlx = { version = "3" }
strum = { version = "0.27", features = ["derive"] }
tempfile = { version = "3.20" }
tokio = { version = "1", features = ["macros", "process", "io-util", "rt-multi-thread", "sync"] }
toml = { version = "0.8" }
xxhash-rust = { version = "0.8", features = ["xxh3"] }

# The embedded base every load merges onto. A user file overrides field by field;
# anything absent from both falls through to the code defaults.
#
# This file carries only what is NOT an argument. The store coordinate (--id,
# --namespace), the work dir (--workdir) and the deny list (--deny) stay arguments;
# setting one here is an unknown-field error.
#
# Paths are STRINGS so this file stays portable: a leading `~` or `$VAR` expands at
# load, with the XDG family honoring the basedir spec fallbacks.

[channel]
# port is OMITTED here on purpose: absent means the kernel assigns one, which is the
# default. The agent learns the real endpoint from channel_open's return, so nothing
# needs a fixed port. Set it only if something outside that flow has to predict the
# address - and then it must be unprivileged (1024-65535); the host does not run as
# root, so a lower port could only ever fail to bind, and 0 is rejected rather than
# meaning "any".
#
#   port = 47800
#
# Where grammar_cert installs the leaf the hub presents. Kept in step with that tool's
# own layout and its $XDGX_SECRET_DATA_HOME fallback.
cert_dir = "$XDGX_SECRET_DATA_HOME/sourcetrait/grammar/certs"

[package]
name = "sourcetrait_grammar_claudeline"
version = "0.0.0-1"
edition = "2024"
description = "Claude Code statusline renderer + session payload mirror"
authors = ["SourceTrait <development@sourcetrait.com>"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/sourcetrait/sourcetrait_grammar"
homepage = "https://sourcetrait.com"
categories = []
keywords = ["sourcetrait", "grammar", "claude", "statusline"]

[[bin]]

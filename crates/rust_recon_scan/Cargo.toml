[package]
name = "rust_recon_scan"
version = "0.0.1"
edition = "2024"
description = "AST-based Rust source scanner for rust_recon - extracts type-identifier usage in fn signatures, struct fields, generic bounds; complements the existing rustscan.py extraction"
authors = ["SourceTrait <development@sourcetrait.com>"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/sourcetrait/sourcetrait_empower"
homepage = "https://sourcetrait.com"
categories = []
keywords = ["sourcetrait", "empower", "rust", "ast", "scanner"]

[[bin]]
name = "rust_recon_scan"
path = "src/main.rs"

[dependencies]
proc-macro2.workspace = true
serde.workspace = true
serde_json.workspace = true
snafu.workspace = true
syn.workspace = true
walkdir.workspace = true

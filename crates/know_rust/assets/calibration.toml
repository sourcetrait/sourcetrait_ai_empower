# know_rust calibration constants.
#
# Defaults consumed by characterize.py + emit.py via config.py.
# Env vars (ORIENT_*) override the TOML defaults when set; the env
# override path is preserved for ad-hoc tuning without touching this
# file.

[mode]
# characterize.py select_mode() histogram-share thresholds. Decide
# between single_dominant / co_equal_few / no_dominant modes.
dominance_share = 0.45
coequal_topk = 4
coequal_share = 0.60
ambiguous_band = 0.07
seam_dense_per_kloc = 4.0

[classification]
# characterize.py _classify_crate_use() flips has-both-bin-and-lib
# crates from end_with_dev_use to dev_with_end_use when cross-crate
# pub_inter_count crosses this threshold.
dev_with_end_threshold = 30

[picker]
# emit.py _compute_sloc_scaled_top_n cap formula:
# cap = max(top_n_floor, round(top_n_floor + sloc_multiplier
#                              * log2(sloc / sloc_divisor)))
#
# The function is monotonic decreasing in sloc_divisor, so smaller
# divisor never drops a previously assigned cap. Calibration tuning
# is a single-line edit here; no python source change.
top_n_floor = 7
sloc_divisor = 25
sloc_multiplier = 1.6

[picker.example]
# Public-set example weighting + threshold boost.
# weight_floor: minimum per-example weight (when 0-1 example files).
# saturation: gamma boost saturates at this curated_example_count.
# threshold: '3+ examples' developer-signaled-importance boost trigger.
# test_weight / bench_weight: per-file contribution from tests/ and
# benches/ directories (curated examples/ stays at 1.0).
weight_floor = 1.0
saturation = 10
threshold = 3
test_weight = 0.3
bench_weight = 0.3

[picker.family]
# method_ref family: minimum distinct workspace-defined outers for a
# `Type::method` reference family to enter pattern_metrics as a
# `method_ref:_::<inner>` workspace-wide entry. Below threshold, the
# inner method is treated as per-Type, not architectural.
method_ref_min_outers = 3

[picker.score]
# Combined-score boost coefficients for ranking patterns within a
# significance set. Score formula:
#   score = raw_count
#         * (1 + inter_boost * inter_ratio)
#         * (1 + pub_boost * is_pub)
#         * (1 + example_boost * min(example_count, saturation) / saturation)
#         * (example_threshold_boost if curated_example_count >= threshold else 1)
inter_boost = 0.5
pub_boost = 0.3
example_boost = 0.5
example_threshold_boost = 1.5

[picker.cluster]
# S1 (crate / region map) emits a "Crate clusters (by name prefix)"
# sub-section when workspace member count exceeds `threshold`.
# Each cluster requires at least `min_size` members.
threshold = 15
min_size = 3

[filters]
# Filter sets applied at picker / synthesis time. Lists are loaded
# as Python frozensets (membership tested O(1)).

# method_ref outer skip set. Self is self-reference inside impls
# (not architectural at workspace level); the std trait shells are
# universal trait-method-invocation noise.
method_ref_outer_skip = [
    "Self",
    "Default", "Display", "Debug",
    "From", "Into", "TryFrom", "TryInto",
    "Clone",
    "AsRef", "AsMut",
    "Drop",
    "PartialEq", "Eq", "Hash", "PartialOrd", "Ord",
    "Iterator", "IntoIterator",
    "Poll",
]

# method_ref inner skip set. Generic constructor / formatter method
# names; not architectural verbs.
method_ref_inner_skip = [
    "new", "default", "from", "into", "try_from", "try_into",
    "fmt", "clone", "as_ref", "as_mut", "deref", "deref_mut",
    "eq", "ne", "cmp", "partial_cmp", "hash",
    "drop", "next", "iter", "into_iter", "iter_mut",
    "build", "into_inner", "borrow", "borrow_mut",
]

# Test / bench / example file segments excluded from the architectural
# type-usage aggregation (those files demonstrate canonical usage and
# belong to the example-mining pool, not the picker pool).
excluded_dir_segments = ["tests", "benches", "examples"]

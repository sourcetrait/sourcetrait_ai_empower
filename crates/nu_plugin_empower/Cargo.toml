[package]
name = "nu_plugin_empower"
version = "0.0.1"
edition = "2024"
description = "Nushell plugin for sourcetrait_empower"
authors = ["SourceTrait <development@sourcetrait.com>"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/sourcetrait/sourcetrait_empower"
homepage = "https://sourcetrait.com"
categories = []
keywords = ["sourcetrait", "empower", "nu-plugin"]

[[bin]]
name = "nu_plugin_empower"
path = "src/main.rs"

[dependencies]
sourcetrait_cmdlib_empower = { path = "../sourcetrait_cmdlib_empower" }
snafu.workspace = true
nu-plugin.workspace = true
nu-protocol.workspace = true

# [dev-dependencies] left empty for now -- nu-plugin-test-support 0.113 pulls
# in nu-plugin-engine 0.113.1 which has a non-exhaustive-match upstream bug
# (ServerCommunicationIo::LocalSocket arm missing in init.rs); re-add when an
# upstream release ships the fix. Phase 3 verifies end-to-end via warm_nushell.

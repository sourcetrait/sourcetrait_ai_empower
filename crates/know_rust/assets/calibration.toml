# know_rust calibration constants.
#
# Defaults consumed by characterize.py + emit.py via config.py.
# Env vars (ORIENT_*) override the TOML defaults when set; the env
# override path is preserved for ad-hoc tuning without touching this
# file.

[mode]
# characterize.py select_mode() histogram-share thresholds. Decide
# between single_dominant / co_equal_few / no_dominant modes.
dominance_share = 0.45
coequal_topk = 4
coequal_share = 0.60
ambiguous_band = 0.07
seam_dense_per_kloc = 4.0

[classification]
# characterize.py _classify_crate_use() flips has-both-bin-and-lib
# crates from end_with_dev_use to dev_with_end_use when cross-crate
# pub_inter_count crosses this threshold.
dev_with_end_threshold = 30

[picker]
# emit.py _compute_sloc_scaled_top_n cap formula:
# cap = max(top_n_floor, round(top_n_floor + sloc_multiplier
#                              * log2(sloc / sloc_divisor)))
#
# The function is monotonic decreasing in sloc_divisor, so smaller
# divisor never drops a previously assigned cap. Calibration tuning
# is a single-line edit here; no python source change.
top_n_floor = 7
sloc_divisor = 25
sloc_multiplier = 1.6

[picker.example]
# Public-set example weighting + threshold boost.
# weight_floor: minimum per-example weight (when 0-1 example files).
# saturation: gamma boost saturates at this curated_example_count.
# threshold: '3+ examples' developer-signaled-importance boost trigger.
# test_weight / bench_weight: per-file contribution from tests/ and
# benches/ directories (curated examples/ stays at 1.0).
weight_floor = 1.0
saturation = 10
threshold = 3
test_weight = 0.3
bench_weight = 0.3

[picker.family]
# method_ref family: minimum distinct workspace-defined outers for a
# `Type::method` reference family to enter pattern_metrics as a
# `method_ref:_::<inner>` workspace-wide entry. Below threshold, the
# inner method is treated as per-Type, not architectural.
method_ref_min_outers = 3

[picker.score]
# Combined-score boost coefficients for ranking patterns within a
# significance set. Score formula:
#   score = raw_count
#         * (1 + inter_boost * inter_ratio)
#         * (1 + pub_boost * is_pub)
#         * (1 + example_boost * min(example_count, saturation) / saturation)
#         * (example_threshold_boost if curated_example_count >= threshold else 1)
inter_boost = 0.5
pub_boost = 0.3
example_boost = 0.5
example_threshold_boost = 1.5

[picker.cluster]
# S1 (crate / region map) emits a "Crate clusters (by name prefix)"
# sub-section when workspace member count exceeds `threshold`.
# Each cluster requires at least `min_size` members.
threshold = 15
min_size = 3

[filters]
# Filter sets applied at picker / synthesis time. Lists are loaded
# as Python frozensets (membership tested O(1)).

# method_ref outer skip set. Self is self-reference inside impls
# (not architectural at workspace level); the std trait shells are
# universal trait-method-invocation noise.
method_ref_outer_skip = [
    "Self",
    "Default", "Display", "Debug",
    "From", "Into", "TryFrom", "TryInto",
    "Clone",
    "AsRef", "AsMut",
    "Drop",
    "PartialEq", "Eq", "Hash", "PartialOrd", "Ord",
    "Iterator", "IntoIterator",
    "Poll",
]

# method_ref inner skip set. Generic constructor / formatter method
# names; not architectural verbs.
method_ref_inner_skip = [
    "new", "default", "from", "into", "try_from", "try_into",
    "fmt", "clone", "as_ref", "as_mut", "deref", "deref_mut",
    "eq", "ne", "cmp", "partial_cmp", "hash",
    "drop", "next", "iter", "into_iter", "iter_mut",
    "build", "into_inner", "borrow", "borrow_mut",
]

# Test / bench / example file segments excluded from the architectural
# type-usage aggregation (those files demonstrate canonical usage and
# belong to the example-mining pool, not the picker pool).
excluded_dir_segments = ["tests", "benches", "examples"]

# Pattern-key substring blacklist (NF5). Any pattern key (kind:name,
# pre-translation) containing any listed substring is dropped before
# pattern_metrics computation; the decl-API channel consults the same
# list before minting declaration keys. `::test_` catches the nushell
# `Value::test_*` + `Span::test_data` test-helper noise (~3000+
# entries per the 0.0.34 phase 4 pass B audit); `_test_` catches the
# infix shape (`_var_for_test_*`, `into_test_result`,
# `nu_test_support::*`) - the underscore on BOTH sides keeps
# production names like `latest_*` unaffected. Add ecosystem-specific
# shapes (e.g. `::__bench_`, `::__fuzz_`) when a new noise family
# surfaces.
pattern_skip_substrings = ["::test_", "_test_"]

[picker.classifier]
# Form sub-classifier thresholds. Each rides a GENERAL structural
# signal (a count derivable from any workspace's AST); no per-subject
# hardcoded name-lists (mechanical-broad, subagent-fine per
# notes/know_rust/working/05_calibration.md).
#
# `foundational_min_total` is the minimum `intra + inter + example`
# count at which a structure pattern classifies Foundational rather
# than Incidental. Default 30 was tuned on the bevy spot test: bevy's
# S5.1 structure protagonists (Res / Transform / Commands / App /
# ResMut / Query / ...) all clear 30 comfortably.
#
# `lifecycle_impl_threshold` is the minimum non-cfg-gated workspace
# impl count at which a trait classifies Lifecycle rather than Marker.
# Default 5 was tuned on bevy + ratatui: bevy's Plugin / FromWorld /
# AssetLoader cleared it; ratatui Backend (3 impls) did not. Lower to
# 3 to capture more lifecycle interfaces at the cost of false-positives
# on incidentally-implemented traits.
#
# The Configuring group (configured-via-attributes derives + configuring
# attribute-macros) carries NO mechanical sub-form: the removed
# `configured_derives` allowlist + the empty `lifecycle_traits` override
# were per-subject cheats that did not generalize to unseen subjects.
# The broad group mark is the whole mechanical signal; the subagent
# thought-experiment does the fine subclassification.
foundational_min_total = 30
lifecycle_impl_threshold = 5

[picker.prose_budget]
# Per-pick prose budget hints (character counts) per (form / sub_form,
# set). Soft hints to the kp pipeline Stage C drafting subagent; Stage
# D reduction naturally produces below these values when content is
# non-inferrable from the visible context (signature + name + seed).
#
# Form sub-classification (which row to look up):
#   structure: foundational vs incidental (high intra+inter+example
#     count is foundational; thin structure is incidental)
#   traits: lifecycle (rich method set or significant impl-count)
#     vs marker (zero methods or marker bound)
#   utilities: free_fn vs macro
#   configuring / impl_fns / trait_fns / globals: no sub-form
#     (configuring is one broad row; the subagent sets actual depth)
#
# Tuned 2026-06-05 from a 5-pick bevy spot test against the picks-data
# refactor (per notes/know_rust/knowledge_product_authoring.md
# "Cross-axis matrix"); see that doc for the calibration history and
# the aggregate-budget triage rule that applies when total kp bundle
# exceeds 30% of a 1M end-reader context window.

[picker.prose_budget.structure_foundational]
architecture = 800
public = 700
inter_crate = 600
clique = 600
intra_crate = 150
inner_crate = 400

[picker.prose_budget.structure_incidental]
architecture = 400
public = 350
inter_crate = 300
clique = 300
intra_crate = 80
inner_crate = 200

[picker.prose_budget.traits_lifecycle]
architecture = 1200
public = 1000
inter_crate = 1000
clique = 900
intra_crate = 300
inner_crate = 600

[picker.prose_budget.traits_marker]
architecture = 500
public = 400
inter_crate = 350
clique = 350
intra_crate = 80
inner_crate = 250

# Configuring (configured-via-attributes derives + configuring attr-
# macros): ONE broad budget hint, no mechanical sub-form. The surviving
# workspace-originated configuring picks are predominantly the rich
# configured kind (std/external marker derives are gated out by origin),
# so the row keeps the rich budget; the subagent sets actual depth and
# Stage C/D naturally produces less for a thin pick.
[picker.prose_budget.configuring]
architecture = 1200
public = 1100
inter_crate = 1000
clique = 900
intra_crate = 350
inner_crate = 700

[picker.prose_budget.implementation_functions]
architecture = 300
public = 250
inter_crate = 200
clique = 200
intra_crate = 80
inner_crate = 150

[picker.prose_budget.trait_functions]
architecture = 300
public = 250
inter_crate = 200
clique = 200
intra_crate = 80
inner_crate = 150

[picker.prose_budget.utilities_free_fn]
architecture = 250
public = 220
inter_crate = 180
clique = 180
intra_crate = 80
inner_crate = 130

[picker.prose_budget.utilities_macro]
architecture = 350
public = 300
inter_crate = 250
clique = 250
intra_crate = 100
inner_crate = 180

[picker.prose_budget.globals]
architecture = 100
public = 90
inter_crate = 70
clique = 70
intra_crate = 40
inner_crate = 60

# R4b cap matrix - per-(PickGroup, PickSet) top-N cap via
# multiplicative inheritance from the base SLOC-scaled cap formula
# (`cap = max(floor, round(floor + multiplier * log2(sloc / divisor)))`):
#
#   cap[group][set] = max(floor, round(base(sloc) * group_mult[group]
#                                                 * set_mult[set]))
#
# Replaces the single global top-N cap with per-cell tuning.
# Multiplicative inheritance (13 multipliers: 7 group + 6 set) is
# preferred over independent grid axes (42 stored cell values) per
# the_user 2026-06-05 direction in
# `notes/know_rust/working/05_calibration.md`.
#
# Calibration objective per `mem:know-rust-kp-output-token-target`:
# big-repo low-end target = 200K tokens (~20% of 1M agent context);
# hard ceiling = 300K (~30%). Bevy at the prior single-cap formula
# yields ~143K (~14%) - UNDER the floor; matrix has headroom.
#
# Tuned weights (2026-06-07 the_user-locked at bevy 221K = 22% on 1M
# agent context, in the 200-300K target band). Set widening hierarchy:
#   architecture < public = inter_crate = clique < intra_crate < inner_crate
# Rationale: intersection-limited sets (architecture especially) carry
# few patterns natively so wider weights don't add picks; per-crate
# sets (intra / inner) have many patterns across the workspace's
# crates, so widening helps more. inner_crate is the widest at 5.0
# because per-crate own-architecture is the bulkiest signal pool.
#
# Group multipliers: traits + structure (architectural backbone) at
# 1.5; configuring at 1.2; functions sample at 1.0; utilities +
# globals lifted to 1.5 / 1.2 (the initial 0.8 / 0.5 trim suppressed
# too much of bevy's contribution under the prose budgets).

[picker.consumer_weight]
# Consumer-demand significance weights (the weight blob written by
# `measure consumers --weights-out`, supplied to emit via the global
# `-w/--weights` flag; no blob = term off).
#
# site_weight: per-demand-site BASE score for zero-usage decl-channel
#   pair keys (consumer demand is their only score source); they enter
#   the PUBLIC set ("public-by-consumption") and compete under the
#   existing cap matrix.
# usage_boost: additive per-site boost for pair keys that already
#   carry usage-derived public scores (consumer demand corroborating
#   internal significance).
site_weight = 1.0
usage_boost = 0.25

# Documentation-kind profiles. A profile states what KIND of
# documentation the emit is for and calibrates at that higher level:
# a per-set cap scale layered over [picker.cap_matrix] (1.0 = base
# cap unchanged; 0.0 = set OFF - not elected, not rendered). Selected
# via the global `-p/--profile` flag; `author` is the default and the
# fallback when a calibration file carries no profile sections.
#
# author: the maintainer/author-dev bundle - all six sets; big-repo
#   aggregate target stays the 200-300K token band (~25% of a 1M
#   reader context as the center of mass). Neutral scales pending the
#   CAP-CUT-data retune.
# consumer: the consumer-dev bundle - the consumer-facing surface
#   (architecture + widened public + inter-crate); no clique, no
#   per-crate internals. The consumer-weight term feeds exactly this
#   audience's public set.
[profile.author.set_scale]
architecture = 1.0
public = 1.0
inter_crate = 1.0
clique = 1.0
intra_crate = 1.0
inner_crate = 1.0

[profile.consumer.set_scale]
architecture = 1.0
public = 1.3
inter_crate = 1.0
clique = 0.0
intra_crate = 0.0
inner_crate = 0.0

[picker.cap_matrix.set]
architecture = 2.5
public = 3.5
inter_crate = 3.5
clique = 3.5
intra_crate = 4.0
inner_crate = 5.0

[picker.cap_matrix.group]
traits = 1.5
trait_functions = 1.0
structure = 1.5
implementation_functions = 1.0
configuring = 1.2
utilities = 1.5
globals = 1.2

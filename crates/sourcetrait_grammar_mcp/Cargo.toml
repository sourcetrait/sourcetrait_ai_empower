[package]
name = "sourcetrait_grammar_mcp"
version = "0.0.0-98"
edition = "2024"
description = "Nushell engine MCP server"
authors = ["SourceTrait <development@sourcetrait.com>"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/sourcetrait/sourcetrait_grammar"
homepage = "https://sourcetrait.com"
categories = []
keywords = ["sourcetrait", "grammar", "nushell", "mcp"]

[[bin]]
name = "grammar_mcp"
path = "src/main.rs"

[features]
# Test-only engine decls (__test_hang / __test_panic) for the lifecycle system
# tests; never enabled in a shipped build.
test-hooks = []

[dependencies]
clap.workspace = true
directories.workspace = true
futures-util.workspace = true
indoc.workspace = true
liquid.workspace = true
nix.workspace = true
nu-cmd-extra.workspace = true
nu-cmd-lang.workspace = true
nu-cmd-plugin.workspace = true
nu-command.workspace = true
nu-engine.workspace = true
nu-json.workspace = true
nu-parser.workspace = true
nu-path.workspace = true
nu-plugin-engine.workspace = true
nu-protocol.workspace = true
nuon.workspace = true
rmcp.workspace = true
rustls.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
sourcetrait_grammar_lib.workspace = true
tokio.workspace = true
tokio-rustls.workspace = true
tokio-tungstenite.workspace = true
toml.workspace = true
xxhash-rust.workspace = true

[dev-dependencies]
sourcetrait_testing.workspace = true

[build-dependencies]
toml.workspace = true

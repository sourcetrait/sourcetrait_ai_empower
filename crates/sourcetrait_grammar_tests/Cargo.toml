[package]
name = "sourcetrait_grammar_tests"
version = "0.0.0-3"
edition = "2024"
description = "System tests for sourcetrait_grammar (spawn the real binary)"
authors = ["SourceTrait <development@sourcetrait.com>"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/sourcetrait/sourcetrait_grammar"
homepage = "https://sourcetrait.com"
categories = []
keywords = ["sourcetrait", "grammar", "testing"]

[features]
# The lifecycle tests need the mcp binary built with ITS own `test-hooks` feature
# (__test_hang / __test_panic). Run both together:
#   cargo build -p sourcetrait_grammar_mcp --features test-hooks
#   cargo test -p sourcetrait_grammar_tests --features test-hooks -- --test-threads=1
test-hooks = []

[dependencies]
futures-util.workspace = true
nix.workspace = true
serde_json.workspace = true
sourcetrait_cert_lib.workspace = true
sourcetrait_testing.workspace = true
tokio.workspace = true
tokio-rustls.workspace = true
tokio-tungstenite.workspace = true

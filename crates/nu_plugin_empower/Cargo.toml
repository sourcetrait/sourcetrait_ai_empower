[package]
name = "nu_plugin_empower"
version = "0.0.1"
edition = "2024"
description = "Nushell plugin for sourcetrait_empower"
authors = ["SourceTrait <development@sourcetrait.com>"]
license = "AGPL-3.0-or-later WITH GPL-3.0-linking-exception"
repository = "https://github.com/sourcetrait/sourcetrait_empower"
homepage = "https://sourcetrait.com"
categories = []
keywords = ["sourcetrait", "empower", "nu-plugin"]

[[bin]]
name = "nu_plugin_empower"
path = "src/main.rs"

[dependencies]
sourcetrait_cmdlib_empower = { path = "../sourcetrait_cmdlib_empower" }
snafu.workspace = true
nu-plugin = "0.113"
nu-protocol = "0.113"
